<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvueMe Demo Calls</title>
  <script>
    // Auth gate: if not signed in this session, go to the login page.
    // Invisible/no-op once logged in — the app below is unchanged.
    if (sessionStorage.getItem('evueme_auth') !== 'ok') {
      window.location.replace('login.html');
    }
  </script>
  <script>
    // Theme (ADDITIVE): light by default, dark toggle in the navbar; persisted in localStorage.
    (function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('demo_theme')==='dark'?'dark':'light');}catch(e){}})();
    function toggleTheme(){var d=document.documentElement.getAttribute('data-theme')==='dark';var n=d?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('demo_theme',n);}catch(e){}var b=document.getElementById('themeBtn');if(b)b.textContent=n==='dark'?'☀️':'🌙';}
    document.addEventListener('DOMContentLoaded',function(){var b=document.getElementById('themeBtn');if(b)b.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙';});
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f7fc;
      color: #1e293b;
      height: 100vh;
      overflow: hidden;        /* the scroll happens inside .scroll-area, below the navbar */
    }

    /* Scrollable content area that starts right below the fixed navbar, so the
       cards are clipped at the navbar's bottom edge and never slide under it. */
    .scroll-area {
      position: fixed; top: 56px; left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      display: flex; flex-wrap: wrap; gap: 24px;
      justify-content: center; align-items: flex-start;
      padding: 36px 16px 44px;
    }

    /* ── Top navigation bar ── */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 1000;
      background: #2563eb;            /* fully opaque — content scrolls cleanly behind it */
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, .18);
    }
    .navbar-left  { color: #ffffff; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
    .navbar-right { display: flex; align-items: center; gap: 14px; }
    .navbar-welcome { color: #e0ecff; font-size: 14px; font-weight: 600; }
    .logout-btn {
      background: #ffffff; color: #2563eb; border: 1px solid #ffffff;
      border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: background .15s, color .15s;
    }
    .logout-btn:hover { background: #e0ecff; }

    /* ── Columns ── */
    .col-form { width: 100%; max-width: 420px; }
    .col-log  { width: 100%; max-width: 520px; display: none; flex-direction: column; }
    .col-log.visible { display: flex; }

    /* ── Card ── */
    .card {
      background: #ffffff;
      border: 1px solid #e3eaf3;
      border-radius: 16px;
      padding: 30px 28px;
      box-shadow: 0 6px 24px rgba(37, 99, 235, .06);
    }

    /* ── Brand ── */
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand-name { font-size: 22px; font-weight: 800; color: #2563eb; letter-spacing: -.02em; }
    .brand-sub { font-size: 13px; color: #64748b; margin-bottom: 28px; line-height: 1.5; }

    /* ── Labels ── */
    .field { margin-bottom: 20px; }
    .field > label {
      display: block; font-size: 13px; font-weight: 700; color: #334155;
      margin-bottom: 8px; letter-spacing: .01em;
    }
    .field > label .req { color: #2563eb; }
    .field > label span.hint { font-weight: 400; color: #94a3b8; }

    /* ── Inputs ── */
    .input-row { display: flex; gap: 8px; }
    .prefix {
      display: flex; align-items: center; padding: 0 13px;
      background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 10px;
      color: #475569; font-size: 14px; white-space: nowrap; flex-shrink: 0;
    }
    input[type="text"], input[type="tel"] {
      width: 100%;
      background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b;
      border-radius: 10px; padding: 11px 14px; font-size: 14px; font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea {
      width: 100%; min-height: 230px; resize: vertical;
      background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b;
      border-radius: 10px; padding: 13px 14px;
      font-size: 13px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      line-height: 1.65; transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus {
      outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }
    input::placeholder, textarea::placeholder { color: #94a3b8; }

    /* ── Job Profile box + reset button ── */
    .textarea-wrap { position: relative; }
    .reset-btn {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      background: #ffffff; color: #2563eb; border: 1px solid #cbd5e1;
      border-radius: 8px; width: 30px; height: 30px;
      font-size: 15px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s;
    }
    .reset-btn:hover { background: #eff4ff; border-color: #2563eb; }
    .textarea-wrap textarea { padding-top: 14px; }

    /* ── Dial button ── */
    #btnDial {
      width: 100%; margin-top: 8px; padding: 15px;
      background: #2563eb; color: #fff;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      transition: background .15s, opacity .15s;
      letter-spacing: .01em;
    }
    #btnDial:hover:not(:disabled) { background: #1d4ed8; }
    #btnDial:disabled { opacity: .5; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #btnDial.loading .spinner  { display: block; }
    #btnDial.loading .btn-icon { display: none; }

    /* ── Banner ── */
    #banner {
      margin-top: 14px; padding: 12px 14px; border-radius: 10px;
      font-size: 13px; line-height: 1.55; display: none; white-space: pre-wrap;
    }
    #banner.ok  { display: block; background: #ecfdf5; border: 1px solid #a7f3d0; color: #047857; }
    #banner.err { display: block; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }

    /* ── Call log panel ── */
    .log-card {
      background: #ffffff; border: 1px solid #e3eaf3; border-radius: 16px;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 6px 24px rgba(37, 99, 235, .06);
    }
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid #eef2f7; flex-shrink: 0;
    }
    .log-title { font-size: 14px; font-weight: 700; color: #1e293b; }
    .log-meta  { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .status-pill {
      font-size: 11px; font-weight: 700; padding: 3px 11px; border-radius: 20px;
      letter-spacing: .06em; text-transform: uppercase; flex-shrink: 0;
    }
    .status-pill.dialing     { background: #dbeafe; color: #1d4ed8; }
    .status-pill.in-progress { background: #dcfce7; color: #15803d; }
    .status-pill.completed   { background: #dcfce7; color: #15803d; }
    .status-pill.ended       { background: #f1f5f9; color: #64748b; }

    /* ── Conversation bubbles ── */
    .conversation {
      flex: 1; overflow-y: auto; padding: 18px 20px;
      display: flex; flex-direction: column; gap: 10px;
      max-height: 420px; min-height: 200px;
    }
    .msg { display: flex; gap: 10px; align-items: flex-end; }
    .msg.bot       { flex-direction: row; }
    .msg.candidate { flex-direction: row-reverse; }
    .msg.sys       { justify-content: center; }

    .avatar {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 12px;
    }
    .msg.bot .avatar       { background: #dbeafe; }
    .msg.candidate .avatar { background: #e2e8f0; }

    .bubble {
      max-width: 80%; padding: 9px 13px; border-radius: 14px;
      font-size: 13px; line-height: 1.55;
    }
    .msg.bot .bubble       { background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 4px; }
    .msg.candidate .bubble { background: #dbeafe; color: #1e3a8a; border-bottom-right-radius: 4px; }
    .msg.sys .bubble       { background: none; color: #94a3b8; font-size: 11px; font-style: italic; padding: 1px 0; }

    /* ── Outcome banner ── */
    .outcome-banner {
      margin: 0 20px 14px; padding: 10px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 600; text-align: center; display: none;
    }
    .outcome-banner.shortlisted    { display: block; background: #ecfdf5; border: 1px solid #a7f3d0; color: #047857; }
    .outcome-banner.callback       { display: block; background: #dbeafe; border: 1px solid #93c5fd; color: #1d4ed8; }
    .outcome-banner.not_interested { display: block; background: #f1f5f9; border: 1px solid #e2e8f0; color: #64748b; }
    .outcome-banner.withdrawn      { display: block; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }

    /* ── Answers table ── */
    .answers-panel { padding: 14px 20px; border-top: 1px solid #eef2f7; display: none; }
    .answers-panel h4 {
      font-size: 11px; font-weight: 700; color: #64748b;
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px;
    }
    .answer-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 5px 0; border-bottom: 1px solid #f1f5f9; font-size: 12px;
      gap: 12px;
    }
    .answer-row:last-child { border-bottom: none; }
    .a-label { color: #64748b; flex-shrink: 0; }
    .a-value { color: #1e293b; font-weight: 600; text-align: right; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .scroll-area { padding: 24px 12px 32px; gap: 18px; }
      .card { padding: 24px 18px; }
      .log-header { padding: 14px 16px; }
      .conversation { padding: 14px 16px; max-height: 360px; }
      .outcome-banner { margin: 0 16px 12px; }
      .answers-panel { padding: 12px 16px; }
      .brand-name { font-size: 20px; }
    }

    /* ── Theme toggle button (in navbar) ── */
    .theme-btn {
      background: transparent; color: #ffffff; border: 1px solid rgba(255,255,255,.6);
      border-radius: 8px; padding: 5px 10px; font-size: 14px; line-height: 1;
      cursor: pointer; font-family: inherit; transition: background .15s;
    }
    .theme-btn:hover { background: rgba(255,255,255,.15); }

    /* ── Dark theme (ADDITIVE) — only when html[data-theme="dark"] ──────────
       Light mode is completely unaffected. */
    html[data-theme="dark"] body { background: #0f172a; color: #e2e8f0; }
    html[data-theme="dark"] .card,
    html[data-theme="dark"] .log-card { background: #1e293b; border-color: #334155; box-shadow: none; }
    html[data-theme="dark"] input[type="text"],
    html[data-theme="dark"] input[type="tel"],
    html[data-theme="dark"] textarea { background: #0f172a; border-color: #334155; color: #e2e8f0; }
    html[data-theme="dark"] .prefix { background: #0f172a; border-color: #334155; color: #cbd5e1; }
    html[data-theme="dark"] .field > label { color: #cbd5e1; }
    html[data-theme="dark"] .brand-sub,
    html[data-theme="dark"] .log-meta { color: #94a3b8; }
    html[data-theme="dark"] .log-title,
    html[data-theme="dark"] .a-value { color: #e2e8f0; }
    html[data-theme="dark"] .log-header,
    html[data-theme="dark"] .answers-panel { border-color: #334155; }
    html[data-theme="dark"] .answer-row { border-color: #1f2a3a; }
    html[data-theme="dark"] .msg.bot .bubble { background: #334155; color: #e2e8f0; }
    html[data-theme="dark"] .reset-btn { background: #0f172a; border-color: #334155; }
  </style>
</head>
<body>

<!-- ── Top navigation bar ──────────────────────────────────────────────── -->
<nav class="navbar">
  <div class="navbar-left">EvueMe Voice Bot</div>
  <div class="navbar-right">
    <span class="navbar-welcome">Welcome, Admin!</span>
    <button id="themeBtn" class="theme-btn" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
    <button id="btnLogout" class="logout-btn">Logout</button>
  </div>
</nav>

<!-- ── Scrollable content (starts below the navbar) ────────────────────── -->
<div class="scroll-area">

<!-- ── Form column ─────────────────────────────────────────────────────── -->
<div class="col-form">
  <div class="card">

    <div class="brand">
      <div class="brand-name">EvueMe</div>
    </div>
    <div class="brand-sub">Fill in the details below and hit Dial Out.</div>

    <!-- Candidate Name -->
    <div class="field">
      <label>Candidate Name <span class="req">*</span></label>
      <input type="text" id="candidateName" placeholder="e.g. Rajesh Kumar" autocomplete="off" required />
    </div>

    <!-- Candidate Number -->
    <div class="field">
      <label>Candidate Number <span class="req">*</span></label>
      <div class="input-row">
        <div class="prefix">+91</div>
        <input type="tel" id="number" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric" autocomplete="off" required />
      </div>
    </div>

    <!-- Job Profile -->
    <div class="field">
      <label>Job Profile <span class="req">*</span> <span class="hint">(edit the values in this JSON)</span></label>
      <div class="textarea-wrap">
        <button type="button" id="btnResetProfile" class="reset-btn" title="Reset to default JSON">↻</button>
        <textarea id="jobProfile" spellcheck="false" required>{
  "job_title": "Area Sales Manager (Retail)",
  "company": "Orient Bell Tiles",
  "job_location": "Mumbai West",
  "experience_required": "5 years",
  "salary_range": "8 to 12 lakhs per annum",
  "notice_period": "30 days",
  "industry": "Tiles, Building Materials, FMCG"
}</textarea>
      </div>
    </div>

    <!-- Dial Out -->
    <button id="btnDial">
      <span class="btn-icon">📲</span>
      <div class="spinner"></div>
      Dial Out
    </button>

    <div id="banner"></div>

  </div>
</div>

<!-- ── Live call log column ────────────────────────────────────────────── -->
<div class="col-log" id="logCol">
  <div class="log-card">

    <div class="log-header">
      <div>
        <div class="log-title" id="logTitle">Live Call</div>
        <div class="log-meta" id="logMeta"></div>
      </div>
      <div class="status-pill dialing" id="statusPill">Dialing</div>
    </div>

    <div class="conversation" id="conversation"></div>

    <div class="outcome-banner" id="outcomeBanner"></div>

    <div class="answers-panel" id="answersPanel">
      <h4>Collected Answers</h4>
      <div id="answerRows"></div>
    </div>

  </div>
</div>

</div><!-- /.scroll-area -->

<script>
  const $ = id => document.getElementById(id);
  let pollTimer = null;
  let seenLogs  = 0;

  // ── Logout ─────────────────────────────────────────────────────────────
  // Clears this app's session. If a demo portal is configured, route through the
  // portal logout so the portal session ends too: SSO entrants land on the portal
  // login, direct entrants on this app's own login.
  $('btnLogout').addEventListener('click', async () => {
    let entry = null;
    try { entry = sessionStorage.getItem('evueme_entry'); } catch (e) {}
    try { sessionStorage.removeItem('evueme_auth'); sessionStorage.removeItem('evueme_entry'); } catch (e) {}
    let portal = '';
    try {
      const r = await fetch('/api/config');
      const j = await r.json();
      portal = (j.portalUrl || '').replace(/\/$/, '');
    } catch (e) {}
    if (portal) {
      if (entry === 'sso') {
        window.location.href = `${portal}/api/sso/logout`;
      } else {
        const ownLogin = `${window.location.origin}/login.html`;
        window.location.href = `${portal}/api/sso/logout?next=${encodeURIComponent(ownLogin)}`;
      }
      return;
    }
    window.location.replace('login.html');
  });

  // ── Reset Job Profile to its default JSON ──────────────────────────────
  const DEFAULT_JOB_PROFILE = $('jobProfile').value;   // captured as-is on load
  $('btnResetProfile').addEventListener('click', () => {
    $('jobProfile').value = DEFAULT_JOB_PROFILE;
  });

  // System log lines that should NOT be shown in the call status box (UI only).
  const HIDDEN_LOG_EXACT = ['Call answered — opening line playing.'];
  const HIDDEN_LOG_PREFIX = ['Call ended. Final state:'];

  // ── Dial ──────────────────────────────────────────────────────────────
  $('btnDial').addEventListener('click', async () => {
    clearInterval(pollTimer);
    const btn = $('btnDial');
    btn.disabled = true;
    btn.classList.add('loading');
    showBanner('', '');

    const name          = $('candidateName').value.trim();
    const number        = $('number').value.trim();
    const jobProfileRaw  = $('jobProfile').value.trim();

    // All three fields are mandatory.
    const missing = [];
    if (!name)          missing.push('Candidate Name');
    if (!number)        missing.push('Candidate Number');
    if (!jobProfileRaw) missing.push('Job Profile');
    if (missing.length) {
      btn.classList.remove('loading');
      btn.disabled = false;
      showBanner('err', '⚠  Please fill all required fields: ' + missing.join(', '));
      return;
    }

    // Validate the Job Profile is proper JSON before dialing.
    try {
      JSON.parse(jobProfileRaw);
    } catch (e) {
      btn.classList.remove('loading');
      btn.disabled = false;
      showBanner('err', '⚠  Job Profile is not valid JSON:\n' + e.message);
      return;
    }

    const payload = {
      number:        number,
      candidateName: name,
      jobProfile:    jobProfileRaw,
    };

    try {
      const res  = await fetch('/api/dial', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      btn.classList.remove('loading');

      if (!data.ok) {
        showBanner('err', '⚠  ' + data.error + (data.detail ? '\n\n' + JSON.stringify(data.detail, null, 2) : ''));
        btn.disabled = false;
        return;
      }

      showBanner('ok', '✅  Calling +91' + data.to.replace('+91','') + '   —   call id: ' + data.callId +
        (!data.webhook ? '\n\n⚠  No PUBLIC_WEBHOOK_URL set. Only the opening line will play.\nAdd your ngrok URL to .env for the full conversation.' : ''));

      openLogPanel(data.to, data.callId);
      startPolling(data.callId);

    } catch (e) {
      btn.classList.remove('loading');
      btn.disabled = false;
      showBanner('err', '⚠  ' + e.message);
    }
  });

  // ── Open the log panel ────────────────────────────────────────────────
  function openLogPanel(to, callId) {
    $('logCol').classList.add('visible');
    $('logTitle').textContent = 'Live Call — ' + to;
    $('logMeta').textContent  = 'id: ' + callId;
    $('conversation').innerHTML = '';
    $('answersPanel').style.display = 'none';
    $('answerRows').innerHTML = '';
    $('outcomeBanner').className = 'outcome-banner';
    $('outcomeBanner').textContent = '';
    setStatus('dialing');
    seenLogs = 0;
  }

  // ── Status pill ───────────────────────────────────────────────────────
  function setStatus(s) {
    const pill = $('statusPill');
    pill.className = 'status-pill ' + s;
    pill.textContent = { dialing: 'Dialing', 'in-progress': 'Live', completed: 'Completed', ended: 'Ended' }[s] || s;
    if (s === 'completed' || s === 'ended') $('btnDial').disabled = false;
  }

  // ── Append new log entries ─────────────────────────────────────────────
  function appendLogs(entries) {
    const conv = $('conversation');
    for (let i = seenLogs; i < entries.length; i++) {
      const e = entries[i];
      if (!e.type || !e.message) continue;
      // Hide selected internal status lines from the display (server unchanged).
      if (e.type !== 'bot' && e.type !== 'candidate') {
        if (HIDDEN_LOG_EXACT.includes(e.message)) continue;
        if (HIDDEN_LOG_PREFIX.some(p => e.message.startsWith(p))) continue;
      }
      const div = document.createElement('div');
      if (e.type === 'bot') {
        div.className = 'msg bot';
        div.innerHTML = `<div class="avatar">🤖</div><div class="bubble">${esc(e.message)}</div>`;
      } else if (e.type === 'candidate') {
        div.className = 'msg candidate';
        div.innerHTML = `<div class="bubble">${esc(e.message)}</div><div class="avatar">👤</div>`;
      } else {
        div.className = 'msg sys';
        div.innerHTML = `<div class="bubble">${esc(e.message)}</div>`;
      }
      conv.appendChild(div);
    }
    seenLogs = entries.length;
    conv.scrollTop = conv.scrollHeight;
  }

  // ── Render collected answers ──────────────────────────────────────────
  function renderAnswers(answers) {
    if (!answers || !answers.length) return;
    $('answersPanel').style.display = 'block';
    $('answerRows').innerHTML = answers
      .map(a => `<div class="answer-row"><span class="a-label">${esc(a.label)}</span><span class="a-value">${esc(a.value)}</span></div>`)
      .join('');
  }

  // ── Render outcome ────────────────────────────────────────────────────
  function renderOutcome(outcome) {
    if (!outcome) return;
    const MAP = {
      shortlisted:    ['shortlisted',   '🎉  Shortlisted — interview link sent on WhatsApp & Email'],
      shortlist:      ['shortlisted',   '🎉  Shortlisted — interview link sent on WhatsApp & Email'],
      callback:       ['callback',      '📅  Callback requested — team will follow up'],
      not_interested: ['not_interested','🙏  Not interested — profile kept on file'],
      withdrawn:      ['withdrawn',     '❌  Withdrawn — profile will not be processed'],
    };
    const [cls, label] = MAP[outcome] || ['', outcome];
    const el = $('outcomeBanner');
    el.className = 'outcome-banner ' + cls;
    el.textContent = label;
  }

  // ── Polling ───────────────────────────────────────────────────────────
  function startPolling(callId) {
    pollTimer = setInterval(async () => {
      try {
        const res = await fetch('/api/status/' + callId);
        const d   = await res.json();
        if (!d.ok) return;
        setStatus(d.status);
        appendLogs(d.log);
        renderAnswers(d.answers);
        if (d.outcome) renderOutcome(d.outcome);
        if (d.status === 'completed' || d.status === 'ended') {
          clearInterval(pollTimer);
          $('btnDial').disabled = false;
        }
      } catch { /* keep polling */ }
    }, 2000);
  }

  // ── Banner ─────────────────────────────────────────────────────────────
  function showBanner(type, msg) {
    const el = $('banner');
    if (!type) { el.style.display = 'none'; return; }
    el.className = type;
    el.textContent = msg;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>

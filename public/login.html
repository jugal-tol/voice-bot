<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvueMe — Login</title>
  <script>
    // If already signed in this session, skip straight to the app.
    if (sessionStorage.getItem('evueme_auth') === 'ok') {
      window.location.replace('index.html');
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f7fc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border: 1px solid #e3eaf3;
      border-radius: 16px;
      padding: 34px 30px;
      box-shadow: 0 10px 30px rgba(37, 99, 235, .08);
    }

    .brand-name {
      font-size: 26px; font-weight: 800; color: #2563eb;
      letter-spacing: -.02em; text-align: center;
    }
    .brand-sub {
      font-size: 13px; color: #64748b; text-align: center;
      margin-top: 6px; margin-bottom: 28px;
    }

    .field { margin-bottom: 18px; }
    .field > label {
      display: block; font-size: 13px; font-weight: 700; color: #334155;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b;
      border-radius: 10px; padding: 12px 14px; font-size: 14px; font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
      outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }
    input::placeholder { color: #94a3b8; }

    #btnLogin {
      width: 100%; margin-top: 6px; padding: 13px;
      background: #2563eb; color: #fff;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background .15s;
    }
    #btnLogin:hover { background: #1d4ed8; }

    #error {
      margin-top: 14px; padding: 11px 14px; border-radius: 10px;
      font-size: 13px; display: none;
      background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-name">EvueMe</div>
    <div class="brand-sub">Sign in to continue</div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" autocomplete="off" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="off" />
      </div>
      <button type="submit" id="btnLogin">Login</button>
      <div id="error"></div>
    </form>
  </div>

  <script>
    const USERNAME = 'evumeadmin';
    const PASSWORD = 'evueme!!123';

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const err = document.getElementById('error');

      if (u === USERNAME && p === PASSWORD) {
        sessionStorage.setItem('evueme_auth', 'ok');
        sessionStorage.setItem('evueme_entry', 'direct'); // logged in directly on this app
        sessionStorage.setItem('evueme_user', u); // remember for the logout event
        // Record this direct login for cross-app reporting (fire-and-forget).
        try {
          let visitorId = localStorage.getItem('demo_visitor');
          if (!visitorId) {
            visitorId = (crypto.randomUUID && crypto.randomUUID()) ||
              `v_${Date.now()}_${Math.random().toString(36).slice(2)}`;
            localStorage.setItem('demo_visitor', visitorId);
          }
          fetch('/api/log-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, visitorId })
          }).catch(() => {});
        } catch (e) { /* logging must never block login */ }
        window.location.replace('index.html');
      } else {
        err.textContent = '⚠  Invalid username or password.';
        err.style.display = 'block';
      }
    });
  </script>

</body>
</html>
